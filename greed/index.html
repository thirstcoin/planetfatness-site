<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Your Greed</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="game-container">
        <div id="grid">
            <script>
                for(let i=0; i<12; i++) {
                    document.write(`<div class="donut" onclick="bite(${i})"></div>`);
                }
            </script>
        </div>
        <div id="status">Click a donut to play...</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
