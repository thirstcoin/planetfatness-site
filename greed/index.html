<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Your Greed</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="intro-overlay">
        <video id="intro-video" muted playsinline preload="auto" class="intro-video">
            <source src="/assets/greed/intro-open.mp4" type="video/mp4">
        </video>

        <div class="intro-content">
            <button id="start-game-btn" type="button">Lock Wager & Start Round</button>
        </div>
    </div>

    <div id="top-ui">
        <div id="multiplier-display">x1.00</div>

        <div id="jackpot-wrap">
            <div id="jackpot-label">Progressive Jackpot</div>
            <div id="jackpot-amount">5,000 PHAT</div>
        </div>
    </div>

    <div id="multiplier-ladder-wrap">
        <div id="ladder-step-label">Step 0 of 10</div>
        <div id="multiplier-ladder"></div>
        <div id="ladder-next-label">Next x1.02</div>
    </div>

    <div id="game-container"></div>

    <div id="cashout-wrap">
        <button id="cashout-button" type="button" disabled>Cash Out</button>
    </div>

    <div id="status">Lock your round to begin.</div>

    <div id="poison-overlay">
        <video id="poison-video" muted playsinline preload="auto" class="overlay-video">
            <source src="/assets/greed/phil-poison.mp4" type="video/mp4">
        </video>

        <div class="overlay-content">
            <h1>POISON! Game Over.</h1>
            <div class="overlay-actions">
                <button id="poison-new-round-btn" type="button">New Round</button>
                <button id="poison-back-chat-btn" type="button">Back to Chat</button>
            </div>
        </div>
    </div>

    <div id="win-overlay">
        <video id="win-video" muted playsinline preload="auto" class="overlay-video">
            <source src="/assets/greed/phil-win.mp4" type="video/mp4">
        </video>

        <div class="overlay-content">
            <h1 id="win-title">YOU FED THE GREED</h1>
            <p id="win-subtitle">Cashed Out</p>
            <p id="win-multiplier">x1.00</p>
            <div class="overlay-actions">
                <button id="win-new-round-btn" type="button">New Round</button>
                <button id="win-back-chat-btn" type="button">Back to Chat</button>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="game.js"></script>
</body>
</html>
