<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Your Greed</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <video id="opening-video" class="fullscreen-video" src="assets/greed/seq_intro_opening.mp4" playsinline muted></video>
    <video id="poison-video" class="fullscreen-video" src="assets/greed/seq_poison_reaction.mp4" playsinline muted></video>

    <div id="multiplier-display">x1.0</div>
    <div id="game-container"></div>
    <div id="status">Click a donut to play...</div>

    <div id="poison-overlay">
        <div class="overlay-content">
            <h1>POISON! Game Over.</h1>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
