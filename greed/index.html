<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Your Greed</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="start-screen">
        <img src="../assets/greed/start-screen-bg.png" alt="Start Game" style="width: 100vw; height: 100vh; object-fit: cover;">
    </div>

    <div id="multiplier-display">x1.0</div>
    <div id="game-container"></div>
    <div id="status">Click a donut to play...</div>

    <div id="poison-overlay">
        <img src="../assets/greed/poison-hit-overlay.png" alt="Poison Hit" style="width: 100vw; height: 100vh; object-fit: cover;">
        <div class="overlay-content">
            <h1>POISON! Game Over.</h1>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
